<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#028BB8" />
    <title>Sin conexión · Blue League</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #6b7280; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #f5f5f5; --muted: #a3a3a3; } }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center;
      }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button {
        background: #028BB8; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="BlueBoot" />
      <h1>Sin conexión</h1>
      <p>Revisá el wifi o los datos y volvé a intentar.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
